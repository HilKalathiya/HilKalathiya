name: Refresh profile

# Rebuilds the profile from showcase.yml and the live state of every showcased
# repository, and commits only when something actually changed.
on:
  schedule:
    - cron: "17 * * * *"        # every hour
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  repository_dispatch:           # instant refresh sent from a project repo (optional)
    types: [project-updated]
  push:
    branches: [main]
    paths: [showcase.yml, tools/**, .github/workflows/refresh.yml]

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python tools/build.py
      - name: Commit if the profile changed
        run: |
          git add -A README.md assets
          if git diff --cached --quiet; then
            echo "Profile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile from project repositories"
          git push
