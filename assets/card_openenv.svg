 y="150" width="150" height="54" rx="12" fill="#0f1626" stroke="#f472b6" stroke-opacity="0.6" stroke-width="1.5"/><text x="115" y="175" font-size="13" fill="#e5e7eb" font-weight="700" text-anchor="middle" >LLM agent</text><text x="115" y="192" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="middle" class="m" >Llama 3</text><rect x="300" y="150" width="150" height="54" rx="12" fill="#0f1626" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.5"/><text x="375" y="175" font-size="13" fill="#e5e7eb" font-weight="700" text-anchor="middle" >Environment</text><text x="375" y="192" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="middle" class="m" >shaped rewards</text><path d="M190 166 L300 166" stroke="#f472b6" stroke-width="2" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/></path><path d="M300 188 L190 188" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="14" dur="1s" repeatCount="indefinite"/></path><circle r="3.5" fill="#f472b6" filter="url(#glow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M190 166 L300 166"/></circle><circle r="3.5" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M300 188 L190 188"/></circle><text x="245" y="161" font-size="9.5" fill="#f472b6" font-weight="600" text-anchor="middle" class="m" >action</text><text x="245" y="206" font-size="9.5" fill="#22d3ee" font-weight="600" text-anchor="middle" class="m" >reward + state</text><text x="40" y="236" font-size="10.5" fill="#34d399" font-weight="600" text-anchor="start" class="m" >+1.0 missing fixed</text><text x="185" y="236" font-size="10.5" fill="#34d399" font-weight="600" text-anchor="start" class="m" >+0.8 dedupe</text><text x="285" y="236" font-size="10.5" fill="#f472b6" font-weight="600" text-anchor="start" class="m" >−1.0 loop penalty</text>
