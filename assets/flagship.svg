idth="134" height="76" rx="14" fill="#0f1626" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/><rect x="801" y="188" width="134" height="4" rx="2" fill="#34d399" opacity="0.9"/><text x="868.0" y="220" font-size="14" fill="#e5e7eb" font-weight="700" text-anchor="middle" >Interfaces</text><text x="868.0" y="241" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="middle" class="m" >CLI·Streamlit·Web</text><text x="811" y="180" font-size="10" fill="#34d399" font-weight="700" text-anchor="start" class="m" >06</text><rect x="642" y="304" width="146" height="40" rx="10" fill="#0f1626" stroke="#f472b6" stroke-opacity="0.5" stroke-dasharray="4 3"/><text x="715.0" y="320" font-size="11" fill="#e5e7eb" font-weight="600" text-anchor="middle" >Chroma vector store</text><text x="715.0" y="335" font-size="9.5" fill="#94a3b8" font-weight="400" text-anchor="middle" class="m" >embed-v4.0 · 4 docs</text><line x1="715.0" y1="304" x2="715.0" y2="264" stroke="#f472b6" stroke-width="2" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="14" dur="1s" repeatCount="indefinite"/></line><text x="36" y="324" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start" >Agent picks per question: SQL tools, doc retrieval, both, or neither.</text><text x="36" y="342" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start" >Not naive RAG: heterogeneous questions deserve routing.</text><rect x="36.0" y="400" width="221.5" height="150" rx="16" fill="#0f1626" stroke="#1e2a44" stroke-width="1.5"/><rect x="52.0" y="400" width="189.5" height="2" fill="#22d3ee" opacity="0.8"/><text x="54.0" y="450" font-size="32" fill="#22d3ee" font-weight="800" text-anchor="start" >≥80%</text><text x="54.0" y="472" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="start" >anomaly recall</text><text x="54.0" y="498" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >Per-UE rolling z-score</text><text x="54.0" y="514" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >replaces fixed −100 dBm / 3</text><text x="54.0" y="530" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >dB thresholds.</text><rect x="271.5" y="400" width="221.5" height="150" rx="16" fill="#0f1626" stroke="#1e2a44" stroke-width="1.5"/><rect x="287.5" y="400" width="189.5" height="2" fill="#a78bfa" opacity="0.8"/><text x="289.5" y="450" font-size="32" fill="#a78bfa" font-weight="800" text-anchor="start" >&lt; naive</text><text x="289.5" y="472" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="start" >forecast MAE</text><text x="289.5" y="498" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >Lag-feature GradientBoosting</text><text x="289.5" y="514" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >predicts RSRP and beats</text><text x="289.5" y="530" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >last-value baseline.</text><rect x="507.0" y="400" width="221.5" height="150" rx="16" fill="#0f1626" stroke="#1e2a44" stroke-width="1.5"/><rect x="523.0" y="400" width="189.5" height="2" fill="#f472b6" opacity="0.8"/><text x="525.0" y="450" font-size="32" fill="#f472b6" font-weight="800" text-anchor="start" >5</text><text x="525.0" y="472" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="start" >tools the agent routes</text><text x="525.0" y="498" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >Query, anomaly scan, cell</text><text x="525.0" y="514" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >summary, threshold advisor,</text><text x="525.0" y="530" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >doc retrieval.</text><rect x="742.5" y="400" width="221.5" height="150" rx="16" fill="#0f1626" stroke="#1e2a44" stroke-width="1.5"/><rect x="758.5" y="400" width="189.5" height="2" fill="#34d399" opacity="0.8"/><text x="760.5" y="450" font-size="32" fill="#34d399" font-weight="800" text-anchor="start" >SQLite</text><text x="760.5" y="472" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="start" >persistent data layer</text><text x="760.5" y="498" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >Export pipeline means reports</text><text x="760.5" y="514" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start" >survive gNB restarts.</text><text x="964" y="578" font-size="11" fill="#64748b" font-weight="400" text-anchor="end" class="m" >Python · LangGraph · scikit-learn · FastAPI · SQLite · Chroma · Streamlit · Next.js</text><text x="36" y="586" font-size="10" fill="#e5e7eb" font-weight="400" text-anchor="start" ></text>
