="226.0" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/></line><circle r="3" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.0s" repeatCount="indefinite" path="M170 226.0 L189 226.0"/></circle><rect x="189" y="188" width="134" height="76" rx="14" fill="#0f1626" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/><rect x="189" y="188" width="134" height="4" rx="2" fill="#22d3ee" opacity="0.9"/><text x="256.0" y="220" font-size="14" fill="#e5e7eb" font-weight="700" text-anchor="middle" >Export</text><text x="256.0" y="241" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="middle" class="m" >parser + synth data</text><text x="199" y="180" font-size="10" fill="#22d3ee" font-weight="700" text-anchor="start" class="m" >02</text><line x1="323" y1="226.0" x2="342" y2="226.0" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/></line><circle r="3" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.25s" repeatCount="indefinite" path="M323 226.0 L342 226.0"/></circle><rect x="342" y="188" width="134" height="76" rx="14" fill="#0f1626" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/><rect x="342" y="188" width="134" height="4" rx="2" fill="#a78bfa" opacity="0.9"/><text x="409.0" y="220" font-size="14" fill="#e5e7eb" font-weight="700" text-anchor="middle" >SQLite</text><text x="409.0" y="241" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="middle" class="m" >2 tables · indexed</text><text x="352" y="180" font-size="10" fill="#a78bfa" font-weight="700" text-anchor="start" class="m" >03</text><line x1="476" y1="226.0" x2="495" y2="226.0" stroke="#a78bfa" stroke-width="2" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/></line><cir