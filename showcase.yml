# What the profile shows, and where each value comes from.
#
# The profile rebuilds itself every hour (.github/workflows/refresh.yml).
# Values written as plain text stay as written. Values written as a "$" binding
# are read fresh from the project's repository on every build, so when you
# change the project, the profile follows:
#
#   {$git: updated}                      date of the latest commit, e.g. "21 Nov 2026"
#   {$git: commits}                      number of commits
#   {$match: 'regex', file: README.md}   first regex group found in that file
#   {$count: 'regex', file: README.md}   how many lines match
#   {$count: 'regex', glob: 'tests/test_*.py'}   matches across many files
#   {$cell: 'row label regex', col: 3, file: README.md, pick: 0}
#                                        nth number inside a Markdown table cell
#
# Each binding may carry `fallback:` (used, with a warning, if the text is no
# longer found) and `format: "{:,}"` for numbers.
#
# A project can also own its panel: put a `.github/showcase.yml` in that
# repository with any of the keys below, and it overrides what is written here.
#
# To add a project: add an entry under `projects`, push, and the profile
# picks it up on the next run (or run the workflow by hand from the Actions tab).

